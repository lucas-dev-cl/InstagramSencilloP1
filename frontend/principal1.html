<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de usuarios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="scripts/scriptSidebar.js" defer></script>
  <script type="module" src="scripts/scriptCrear.js" defer></script>
  <script type="module" src="scripts/scriptBuscar.js" defer></script>
  <script type="module" src="scripts/scriptModificar.js" defer></script>
  <script type="module" src="scripts/scriptCrearPost.js" defer></script>
  <script type="module" src="scripts/scriptPosts.js" defer></script>
</head>
<body class="bg-gray-700">

  <!-- Botón para abrir el sidebar (modo móvil) -->
  <button data-drawer-target="default-sidebar" data-drawer-toggle="default-sidebar" aria-controls="default-sidebar" type="button" 
    class="inline-flex items-center p-2 mt-2 ms-3 text-sm text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 
           focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 
           dark:focus:ring-gray-600">
    <span class="sr-only">Open sidebar</span>
    <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" 
         xmlns="http://www.w3.org/2000/svg">
      <path clip-rule="evenodd" fill-rule="evenodd" 
            d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 
               10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 
               01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 
               010 1.5H2.75A.75.75 0 012 10z"></path>
    </svg>
  </button>

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside id="default-sidebar" 
           class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full 
                  sm:translate-x-0 bg-gray-50 dark:bg-slate-900" 
           aria-label="Sidebar">
      <div class="h-full px-3 py-4 overflow-y-auto">
        <ul class="space-y-4 font-medium">
          <li data-target="contenidoPrincipal">
            <a href="#" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white 
                              hover:bg-gray-100 dark:hover:bg-gray-700">
              <img src="imgs/home-1-svgrepo-com.svg" class="w-7 h-7 bg-white rounded" alt="icono">
              <span class="ms-3">Principal</span>
            </a>
          </li>
          <li data-target="contFormularioCrearUsuario">
            <a href="#" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white 
                              hover:bg-gray-100 dark:hover:bg-gray-700">
              <img src="imgs/create-svgrepo-com.svg" class="w-7 h-7 bg-white rounded" alt="icono">
              <span class="flex-1 ms-3 whitespace-nowrap">Crear usuario</span>
            </a>
          </li>
          <li data-target="contFormularioBuscarUsuarios">
            <a href="#" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white 
                              hover:bg-gray-100 dark:hover:bg-gray-700">
              <img src="imgs/search-alt-2-svgrepo-com.svg" class="w-7 h-7 bg-white rounded" alt="icono">
              <span class="flex-1 ms-3 whitespace-nowrap">Buscar usuario</span>
            </a>
          </li>
          <li data-target="contFormularioModificarUsuario">
            <a href="#" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white 
                              hover:bg-gray-100 dark:hover:bg-gray-700">
              <img src="imgs/create-note-svgrepo-com.svg" class="w-7 h-7 bg-white rounded" alt="icono">
              <span class="flex-1 ms-3 whitespace-nowrap">Modificar usuario</span>
            </a>
          </li>
          <li data-target="contFormularioCrearPost">
            <a href="#" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white 
                              hover:bg-gray-100 dark:hover:bg-gray-700">
              <img src="imgs/add-to-queue-svgrepo-com.svg" class="w-7 h-7 bg-white rounded" alt="icono">
              <span class="flex-1 ms-3 whitespace-nowrap">Añadir post</span>
            </a>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="min-h-screen flex-1 ml-64 flex flex-col px-6 py-16 lg:px-8 bg-gray-700">
        <div id="contenidoPrincipal">
          <div class="max-w-6xl mx-auto">
              <form id="buscarPostForm">   
                    <label for="default-search" class="mb-2 text-sm font-medium text-gray-900 sr-only dark:text-gray-300">Search</label>
                    <div class="relative">
                        <div class="flex absolute inset-y-0 left-0 items-center pl-3 pointer-events-none">
                            <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="search" id="buscadorPost" class="block p-4 pl-10 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Buscar...">
                        <button type="submit" class="text-white absolute right-2.5 bottom-2.5 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Buscar</button>
                    </div>
              </form>
          </div>
          <div id="contenedorPosts" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-4">
            <!-- Aca entran las cartas -->
          </div>
        </div>
      
    
        <!-- CREAR USUARIO DIV -->
        <div class="sm:mx-auto sm:w-full sm:max-w-sm bg-gray-800 rounded p-6 hidden" id="contFormularioCrearUsuario">
          <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" 
              alt="Your Company" class="mx-auto h-10 w-auto" />
          <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-white">Crea un usuario</h2>

          <form action="#" method="POST" class="mt-8 space-y-6" id="formularioCrearUsuario">
            <div>
              <label for="usuario" class="block text-sm font-medium text-gray-100">Nombre de usuario</label>
              <input id="nombreCrear" type="text" name="usuario" required 
                    class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white 
                            placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10 
                            focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 
                            sm:text-sm" />
            </div>

            <div>
              <label for="bio" class="block text-sm font-medium text-gray-100">Bio</label>
              <textarea id="bio" name="bio" rows="3" required 
                        class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white 
                              placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10 
                              focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 
                              sm:text-sm"></textarea>
            </div>

            <div>
              <label for="avatar" class="block text-sm font-medium text-gray-100">Avatar (URL)</label>
              <input id="avatarUrl" type="url" name="avatar" placeholder="https://ejemplo.com/avatar.jpg"
                    class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white 
                            placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10 
                            focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 
                            sm:text-sm" />
            </div>

            <div>
              <button type="submit" 
                      class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm font-semibold 
                            text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 
                            focus-visible:outline-indigo-500">
                Crear usuario
              </button>
            </div>
          </form>

          <p id="resultadoUsuario"></p>
        </div>

        <!-- BUSCAR USUARIO DIV -->
        <div class="max-w-2xl mx-auto hidden" id="contFormularioBuscarUsuarios">
              <div class="flex justify-center">
                  <h1 class="text-3xl font-bold text-white-800 dark:text-white mb-6 border-b-2 border-indigo-500 pb-2">
                      Buscar usuarios
                  </h1>
              </div>
              
              <form class="flex items-center" id="formularioBuscar">
                  <label for="voice-search" class="sr-only">Search</label>
                  <div class="relative w-full">
                      <div class="flex absolute inset-y-0 left-0 items-center pl-3 pointer-events-none">
                          <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"></path></svg>
                      </div>
                      <input type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Buscar..." id="nombreBuscar">
                  </div>
                  <button type="submit" class="inline-flex items-center py-2.5 px-3 ml-2 text-sm font-medium text-white bg-blue-700 rounded-lg border border-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"><svg class="mr-2 -ml-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>Search</button>
              </form>
              
              <div  id="contenedorResultadosBusqueda" class="mt-8 w-full max-w-xl bg-gray-800 rounded p-4 flex flex-col gap-4 hidden">
        
                <ul id="resultadoBuscar" class="space-y-2"></ul>

                <div class="flex gap-4 justify-center">
                  <button id="mostrarMas" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded transition">Mostrar más</button>
                  <button id="mostrarMenos" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded transition hidden">Mostrar menos</button>
                </div>
              </div>

              <div>
                <section id="detalleUsuario" class="mt-6 hidden">
                  <h2 class="text-2xl mb-2 text-white">Perfil del usuario</h2>
                  <div id="infoUsuario"></div>
                  <button id="volver" class="mt-4 bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Volver</button>
                </section>
              </div>
        </div>

        <!-- MODIFICAR USUARIO DIV -->
        <div class="sm:mx-auto sm:w-full sm:max-w-sm bg-gray-800 rounded p-6 hidden" id="contFormularioModificarUsuario">

            <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" 
                alt="Your Company" class="mx-auto h-10 w-auto" />

            <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-white">Modificar Usuario</h2>

            <!-- Formulario Buscar -->
            <form id="formularioBuscarUsuario" class="mt-8 space-y-6">
              <div>
                <label for="nombreBuscarUsuario" class="block text-sm font-medium text-gray-100">Buscar usuario</label>
                <input id="nombreBuscarUsuario" type="text" name="nombre" placeholder="Escribe un nombre..." required
                      class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white
                              placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10
                              focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm" />
              </div>

              <button type="submit"
                      class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm font-semibold
                            text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2
                            focus-visible:outline-indigo-500">
                Buscar
              </button>
            </form>


            <!-- Formulario Modificar -->
            <form id="formularioModificar" class="mt-10 space-y-6">

              <h3 class="text-lg font-semibold text-gray-100">Modificaciones</h3>

              <div>
                <label for="nombreModificar" class="block text-sm font-medium text-gray-100">Nombre</label>
                <input id="nombreModificar" type="text" name="nombre" placeholder="Escribe un nombre..." required
                      class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white
                              placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10
                              focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm" />
              </div>

              <div>
                <label for="bioModificar" class="block text-sm font-medium text-gray-100">Bio</label>
                <textarea id="bioModificar" name="bio" placeholder="Escribe una pequeña bio..." rows="3" required
                          class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white
                                placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10
                                focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm"></textarea>
              </div>

              <div>
                <label for="avatarUrlModificar" class="block text-sm font-medium text-gray-100">Avatar (URL) — opcional</label>
                <input id="avatarUrlModificar" type="text" name="avatarUrl" placeholder="https://ejemplo.com/avatar.jpg"
                      class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white
                              placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10
                              focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm" />
              </div>

              <button type="submit"
                      class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm font-semibold
                            text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2
                            focus-visible:outline-indigo-500">
                Guardar Cambios
              </button>
            </form>

            <div id="resultadoModificar" class="mt-6 text-white text-sm space-y-2"></div>

        </div>    

        <!-- CREAR POST DIV -->
        <div class="sm:mx-auto sm:w-full sm:max-w-sm bg-gray-800 rounded p-6 hidden" id="contFormularioCrearPost">

          <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" 
              alt="Your Company" class="mx-auto h-10 w-auto" />

          <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-white">Crear Post</h2>

          <!-- Formulario Crear Post DIRECTAMENTE -->
          <form id="formularioCrearPost" class="mt-10 space-y-6">

            <h3 class="text-lg font-semibold text-gray-100">Datos del Post</h3>

            <div>
              <label for="nombreUsuarioCrearPost" class="block text-sm font-medium text-gray-100">
                Nombre del usuario
              </label>
              <input id="nombreUsuarioCrearPost" type="text" name="username" placeholder="Escribe el nombre del usuario..."
                    required
                    class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white
                          placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10
                          focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm" />
            </div>

            <div>
              <label for="descripcionCrearPost" class="block text-sm font-medium text-gray-100">Descripción</label>
              <textarea id="descripcionCrearPost" name="description" placeholder="Escribe la descripción del post..." rows="3" required
                        class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white
                              placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10
                              focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm"></textarea>
            </div>

            <div>
              <label for="imagenCrearPost" class="block text-sm font-medium text-gray-100">Imagen (URL)</label>
              <input id="imagenCrearPost" type="text" name="imageUrl" placeholder="https://ejemplo.com/imagen.jpg" required
                    class="mt-2 block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white
                          placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10
                          focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm" />
            </div>

            <button type="submit"
                    class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm font-semibold
                          text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2
                          focus-visible:outline-indigo-500">
              Crear Post
            </button>
          </form>

          <div id="resultadoCrearPost" class="mt-6 text-white text-sm space-y-2"></div>

        </div>
    </main>
  </div>

</body>
</html>
